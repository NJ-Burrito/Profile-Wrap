<!-- hub: the MCP server, a patch unit with three tool jacks and a plug. Colour: obj-base (chassis), obj-accent (plug, lights). Parts: plug (clicks in), led (4, blink), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 170" width="190" height="170" data-object="hub" style="overflow:visible">
<style>
svg[data-object="hub"]{--obj-hi:color-mix(in srgb,var(--obj-base,#3b4258) 55%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#3b4258) 62%,#000);--obj-deep:color-mix(in srgb,var(--obj-base,#3b4258) 22%,#000)}
svg[data-object="hub"] .sh{transform:translate(calc(var(--light-x,-.6)*-8px),calc(var(--light-y,-.6)*-2px));opacity:calc(.32 + .18*var(--light-i,1))}
svg[data-object="hub"] .hl{transform:translate(calc(var(--light-x,-.6)*8px),calc(var(--light-y,-.6)*4px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#3b4258)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="jk" cx=".4" cy=".35" r=".8"><stop offset="0" style="stop-color:color-mix(in srgb,var(--obj-deep) 60%,#fff)"/><stop offset="1" style="stop-color:var(--obj-deep)"/></radialGradient>
<clipPath id="clip"><rect x="8" y="20" width="174" height="108" rx="16"/></clipPath>
<filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse class="sh" cx="96" cy="160" rx="72" ry="6" fill="#000" filter="url(#blur)"/>
<rect x="30" y="126" width="22" height="9" rx="3" style="fill:var(--obj-deep)"/><rect x="138" y="126" width="22" height="9" rx="3" style="fill:var(--obj-deep)"/>
<rect x="8" y="20" width="174" height="108" rx="16" fill="url(#bd)"/>
<rect x="22" y="32" width="86" height="20" rx="6" style="fill:var(--obj-deep)"/>
<path d="M30 42 H62 M70 42 H98" stroke="#fff" stroke-opacity=".5" stroke-width="3.4" stroke-linecap="round"/>
<g style="fill:var(--obj-accent,#f5c320)"><circle data-part="led" cx="128" cy="42" r="4.4"/><circle data-part="led" cx="142" cy="42" r="4.4" opacity=".5"/><circle data-part="led" cx="156" cy="42" r="4.4"/><circle data-part="led" cx="170" cy="42" r="4.4" opacity=".5"/></g>
<g><circle cx="48" cy="86" r="17" fill="url(#jk)" stroke="#000" stroke-opacity=".55" stroke-width="1.3"/><circle cx="48" cy="86" r="9" fill="#000" opacity=".55"/>
<circle cx="95" cy="86" r="17" fill="url(#jk)" stroke="#000" stroke-opacity=".55" stroke-width="1.3"/><circle cx="95" cy="86" r="9" fill="#000" opacity=".55"/>
<circle cx="142" cy="86" r="17" fill="url(#jk)" stroke="#000" stroke-opacity=".55" stroke-width="1.3"/><circle cx="142" cy="86" r="9" fill="#000" opacity=".55"/></g>
<path d="M26 114 H164" stroke="#000" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
<g data-part="plug"><path d="M142 98 C142 140 112 134 100 160" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="7" stroke-linecap="round" transform="translate(1.5 2)"/><path d="M142 98 C142 140 112 134 100 160" fill="none" style="stroke:var(--obj-accent,#f5c320)" stroke-width="5.4" stroke-linecap="round"/>
<rect x="131" y="72" width="22" height="30" rx="6" style="fill:var(--obj-accent,#f5c320)" stroke="#000" stroke-opacity=".55" stroke-width="1.4"/><rect x="134" y="75" width="16" height="6" rx="3" fill="#fff" opacity=".55"/></g>
<g clip-path="url(#clip)"><g class="hl"><rect x="8" y="20" width="174" height="7" rx="3" fill="#fff" opacity=".4"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-40" y="0" width="28" height="170" fill="url(#sheeng)"/></g></g>
<rect x="8" y="20" width="174" height="108" rx="16" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="1.6"/>
</svg>
