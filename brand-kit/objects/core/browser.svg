<!-- browser: light browser window with tab bar, page blocks and a call-to-action button (UI automation). Colours: obj-base (window), obj-accent (button). Parts: btn (press), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" data-object="browser" style="overflow:visible">
<style>
svg[data-object="browser"]{--obj-hi:color-mix(in srgb,var(--obj-base,#f1efe6) 70%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#f1efe6) 78%,#000);--obj-bar:color-mix(in srgb,var(--obj-base,#f1efe6) 62%,#5f6f68);--obj-deep:color-mix(in srgb,var(--obj-base,#f1efe6) 30%,#000)}
svg[data-object="browser"] .sh{transform:translate(calc(var(--light-x,-.6)*-9px),calc(var(--light-y,-.6)*-3px));opacity:calc(.32 + .2*var(--light-i,1))}
svg[data-object="browser"] .hl{transform:translate(calc(var(--light-x,-.6)*14px),calc(var(--light-y,-.6)*8px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<clipPath id="clip"><rect x="8" y="8" width="144" height="98" rx="12"/></clipPath>
<linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,var(--obj-bar) 70%,#fff)"/><stop offset="1" style="stop-color:var(--obj-bar)"/></linearGradient>
<linearGradient id="btng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,var(--obj-accent,#ff8a4c) 70%,#fff)"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--obj-accent,#ff8a4c) 78%,#000)"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-10%" y="-30%" width="120%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect class="sh" x="18" y="24" width="132" height="92" rx="16" fill="#000" filter="url(#blur)"/>
<rect x="8" y="8" width="144" height="98" rx="12" fill="url(#win)"/>
<g clip-path="url(#clip)">
<rect x="8" y="8" width="144" height="24" fill="url(#bar)"/>
<path d="M8 32 H152" stroke="#000" stroke-opacity=".3" stroke-width="1.4"/>
<g stroke="#000" stroke-opacity=".3" stroke-width=".8"><circle cx="21" cy="20" r="4" fill="#ff8f7a"/><circle cx="33" cy="20" r="4" fill="#ffd36a"/><circle cx="45" cy="20" r="4" fill="#7ee0a0"/></g>
<rect x="58" y="14" width="82" height="12" rx="6" fill="#fff" fill-opacity=".7"/>
<rect x="64" y="18.5" width="40" height="3.4" rx="1.7" fill="#000" fill-opacity=".28"/>
<rect x="18" y="42" width="70" height="9" rx="4.5" fill="#000" fill-opacity=".62"/>
<rect x="18" y="58" width="104" height="5" rx="2.5" fill="#000" fill-opacity=".25"/>
<rect x="18" y="68" width="84" height="5" rx="2.5" fill="#000" fill-opacity=".25"/>
<rect x="118" y="40" width="26" height="22" rx="4" fill="#000" fill-opacity=".14"/>
<path d="M122 58 L129 49 L134 55 L137 51 L142 58 Z" fill="#000" fill-opacity=".3"/>
<g data-part="btn" data-pivot="104 91"><rect x="82" y="80" width="44" height="20" rx="8" fill="url(#btng)" stroke="#4a2410" stroke-opacity=".6" stroke-width="1.4"/><rect x="92" y="88" width="24" height="4.4" rx="2.2" fill="#fff" fill-opacity=".85"/><rect x="84" y="81.4" width="40" height="5" rx="2.5" fill="#fff" fill-opacity=".3"/></g>
<path d="M8 32 L96 32 L40 106 L8 106 Z" fill="url(#gloss)"/>
<g class="hl"><path d="M8 8 H100 L72 32 H8 Z" fill="#fff" opacity=".18"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-70" y="0" width="50" height="120" fill="url(#sheeng)"/></g>
</g>
<rect x="8.75" y="8.75" width="142.5" height="96.5" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/>
<rect x="8" y="8" width="144" height="98" rx="12" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1"/>
</svg>
