<!-- dice: a die (a different path each run). Colour: obj-base (die), obj-ink (pips). Parts: roll (whole die, pivot at centre), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 140" width="130" height="140" data-object="dice" style="overflow:visible">
<style>
svg[data-object="dice"]{--obj-hi:color-mix(in srgb,var(--obj-base,#2340e0) 52%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#2340e0) 62%,#000);--obj-deep:color-mix(in srgb,var(--obj-base,#2340e0) 26%,#000)}
svg[data-object="dice"] .sh{transform:translate(calc(var(--light-x,-.6)*-8px),calc(var(--light-y,-.6)*-2px));opacity:calc(.32 + .18*var(--light-i,1))}
svg[data-object="dice"] .hl{transform:translate(calc(var(--light-x,-.6)*7px),calc(var(--light-y,-.6)*5px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<linearGradient id="fc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#2340e0)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="12" y="12" width="98" height="98" rx="22"/></clipPath>
<filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse class="sh" cx="66" cy="132" rx="46" ry="5.5" fill="#000" filter="url(#blur)"/>
<g data-part="roll" data-pivot="61 61">
<rect x="20" y="20" width="98" height="98" rx="22" style="fill:var(--obj-deep)" stroke="#000" stroke-opacity=".5" stroke-width="1.4"/>
<rect x="12" y="12" width="98" height="98" rx="22" fill="url(#fc)" stroke="#000" stroke-opacity=".55" stroke-width="1.6"/>
<g style="fill:var(--obj-ink,#fff)"><circle cx="35" cy="35" r="9.5"/><circle cx="87" cy="35" r="9.5"/><circle cx="61" cy="61" r="9.5"/><circle cx="35" cy="87" r="9.5"/><circle cx="87" cy="87" r="9.5"/></g>
<g fill="#000" opacity=".25"><circle cx="35" cy="38" r="9.5"/><circle cx="87" cy="38" r="9.5"/><circle cx="61" cy="64" r="9.5"/><circle cx="35" cy="90" r="9.5"/><circle cx="87" cy="90" r="9.5"/></g>
<g style="fill:var(--obj-ink,#fff)"><circle cx="35" cy="35" r="9.5"/><circle cx="87" cy="35" r="9.5"/><circle cx="61" cy="61" r="9.5"/><circle cx="35" cy="87" r="9.5"/><circle cx="87" cy="87" r="9.5"/></g>
<g clip-path="url(#clip)"><g class="hl"><ellipse cx="42" cy="26" rx="34" ry="11" fill="#fff" opacity=".4" transform="rotate(-14 42 26)"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-40" y="0" width="26" height="120" fill="url(#sheeng)"/></g></g>
</g>
</svg>
