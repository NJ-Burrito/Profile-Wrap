<!-- cursor-arrow: pointer arrow. Hotspot (tip) at 6,4 in the 48x48 viewBox. Colour: obj-ink (outline). Parts: wiggle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" data-object="cursor-arrow" style="overflow:visible">
<style>
svg[data-object="cursor-arrow"] .sh{transform:translate(calc(4px + var(--light-x,-.6)*-4px),calc(7px + var(--light-y,-.6)*-2px));opacity:calc(.28 + .16*var(--light-i,1))}
svg[data-object="cursor-arrow"] .hl{transform:translate(calc(var(--light-x,-.6)*1.2px),calc(var(--light-y,-.6)*1.2px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<path id="p" d="M6 4 L6 38 L14.5 30.5 L20.5 44 L27.5 41 L21.6 28 L33 28 Z"/>
<clipPath id="clip"><use href="#p"/></clipPath>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#eceff4"/><stop offset="1" stop-color="#c3c9d6"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<use class="sh" href="#p" fill="#000" filter="url(#blur)"/>
<g data-part="wiggle" data-pivot="6 4">
<use href="#p" fill="url(#g)"/>
<g clip-path="url(#clip)">
<path d="M20.5 44 L27.5 41 L21.6 28 L14.5 30.5 Z" fill="#8a93a8" opacity=".3"/>
<path d="M33 28 L21.6 28 L27.5 41 L36 41 Z" fill="#8a93a8" opacity=".22"/>
<g class="hl"><path d="M7.4 5.5 L7.4 33" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
</g>
<use href="#p" fill="none" stroke="var(--obj-ink,#0b1020)" stroke-width="2.6" stroke-linejoin="round"/>
</g>
</svg>
