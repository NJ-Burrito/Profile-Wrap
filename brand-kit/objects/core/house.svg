<!-- house: cardboard model house, front view. Colour: obj-base (kraft), obj-glow. Parts: glow (doorway light), sheen. Doorway cut-out at x130-230, y168-300. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" data-object="house" style="overflow:visible">
<style>
svg[data-object="house"]{--obj-hi:color-mix(in srgb,var(--obj-base,#c99a62) 72%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#c99a62) 64%,#000);--obj-deep:color-mix(in srgb,var(--obj-base,#c99a62) 38%,#000);--obj-roofa:color-mix(in srgb,var(--obj-base,#c99a62) 70%,#3a1d0c);--obj-roofb:color-mix(in srgb,var(--obj-base,#c99a62) 48%,#2a1408)}
svg[data-object="house"] .sh{transform:translate(calc(var(--light-x,-.6)*-14px),calc(var(--light-y,-.6)*-2px));opacity:calc(.34 + .2*var(--light-i,1))}
svg[data-object="house"] .hl{transform:translate(calc(var(--light-x,-.6)*10px),calc(var(--light-y,-.6)*8px));opacity:calc(.7*var(--light-i,1))}
</style>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#c99a62)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-roofa)"/><stop offset="1" style="stop-color:var(--obj-roofb)"/></linearGradient>
<linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0604"/><stop offset="1" stop-color="#2a1a10"/></linearGradient>
<radialGradient id="glowg" cx=".5" cy=".62" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" style="stop-color:var(--obj-glow,#ffb627)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--obj-glow,#ffb627)" stop-opacity=".25"/></radialGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="flute" width="360" height="5" patternUnits="userSpaceOnUse"><rect width="360" height="1.4" y="3" fill="#000" opacity=".07"/><rect width="360" height="1" y="0" fill="#fff" opacity=".05"/></pattern>
<pattern id="corr" width="7" height="8" patternUnits="userSpaceOnUse"><rect width="7" height="8" style="fill:var(--obj-lo)"/><path d="M0 8 Q1.75 0 3.5 8 T7 8" fill="none" style="stroke:var(--obj-hi)" stroke-width="1.6"/></pattern>
<clipPath id="all"><rect x="14" y="110" width="332" height="190"/><polygon points="-6,118 180,6 366,118"/></clipPath>
<clipPath id="dway"><rect x="130" y="168" width="100" height="132"/></clipPath>
<filter id="blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<ellipse class="sh" cx="186" cy="298" rx="190" ry="11" fill="#000" filter="url(#blur)"/>
<rect x="14" y="110" width="332" height="190" fill="url(#wall)"/>
<rect x="14" y="110" width="332" height="190" fill="url(#flute)"/>
<rect x="14" y="110" width="7" height="190" fill="#fff" opacity=".16"/>
<rect x="338" y="110" width="8" height="190" fill="#000" opacity=".14"/>
<rect x="310" y="110" width="22" height="190" fill="#f3e4c6" opacity=".34"/>
<rect x="310" y="110" width="22" height="190" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1"/>
<rect x="14" y="291" width="332" height="9" fill="url(#corr)"/>
<path d="M14 291 H346" stroke="#000" stroke-opacity=".25" stroke-width="1.2"/>
<g clip-path="url(#dway)">
<rect x="130" y="168" width="100" height="132" fill="url(#inside)"/>
<g data-part="glow" opacity="0"><rect x="130" y="168" width="100" height="132" fill="url(#glowg)"/></g>
<polygon points="130,300 230,300 214,262 146,262" fill="#fff" opacity=".05"/>
<rect x="130" y="168" width="100" height="14" fill="#000" opacity=".35"/>
</g>
<rect x="130" y="168" width="8" height="132" fill="url(#corr)"/>
<rect x="130" y="168" width="100" height="7" fill="url(#corr)"/>
<rect x="222" y="168" width="8" height="132" fill="url(#corr)" opacity=".8"/>
<path d="M130 168 H230 V300 H130 Z" fill="none" style="stroke:var(--obj-deep)" stroke-opacity=".75" stroke-width="2"/>
<polygon points="-6,118 180,6 366,118" fill="url(#roof)"/>
<polygon points="-6,118 180,6 366,118" fill="url(#flute)" opacity=".8"/>
<path d="M180 6 L180 118 M96 62 L100 118 M264 62 L260 118" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="2"/>
<path d="M180 6 L-6 118 M180 6 L366 118" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
<polygon points="236,34 262,50 232,118 206,118" fill="#f3e4c6" opacity=".3"/>
<rect x="-6" y="112" width="372" height="14" fill="url(#corr)"/>
<path d="M-6 126 H366" stroke="#000" stroke-opacity=".3" stroke-width="1.4"/>
<rect x="-6" y="112" width="372" height="3" fill="#fff" opacity=".22"/>
<g clip-path="url(#all)"><g class="hl"><ellipse cx="86" cy="76" rx="92" ry="52" fill="url(#hlg)" opacity=".42"/><ellipse cx="110" cy="170" rx="90" ry="50" fill="url(#hlg)" opacity=".25"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-90" y="0" width="60" height="300" fill="url(#sheeng)"/></g></g>
<polygon points="-6,118 180,6 366,118" fill="none" style="stroke:var(--obj-deep)" stroke-opacity=".7" stroke-width="2" stroke-linejoin="round"/>
<rect x="14" y="126" width="332" height="174" fill="none" style="stroke:var(--obj-deep)" stroke-opacity=".6" stroke-width="2"/>
</svg>
