<!-- stopwatch: metal case, crown and side button, dial with ticks and a coloured wedge. Colour: obj-base (case), obj-accent (wedge, hand). Parts: hand (sweeps), crown (clicks), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" data-object="stopwatch" style="overflow:visible">
<style>
svg[data-object="stopwatch"]{--obj-hi:color-mix(in srgb,var(--obj-base,#6ea2ff) 60%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#6ea2ff) 58%,#000);--obj-deep:color-mix(in srgb,var(--obj-base,#6ea2ff) 26%,#000)}
svg[data-object="stopwatch"] .sh{transform:translate(calc(var(--light-x,-.6)*-8px),calc(var(--light-y,-.6)*-2px));opacity:calc(.32 + .18*var(--light-i,1))}
svg[data-object="stopwatch"] .hl{transform:translate(calc(var(--light-x,-.6)*5px),calc(var(--light-y,-.6)*5px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<linearGradient id="case" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#6ea2ff)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<radialGradient id="dial" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d9e6"/></radialGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><circle cx="60" cy="82" r="50"/></clipPath>
<filter id="blur" x="-30%" y="-40%" width="160%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse class="sh" cx="64" cy="134" rx="46" ry="6" fill="#000" filter="url(#blur)"/>
<g data-part="crown" data-pivot="60 22">
<rect x="48" y="6" width="24" height="18" rx="4" fill="url(#case)" stroke="#000" stroke-opacity=".5" stroke-width="1.2"/>
<path d="M52 12 H68 M52 16 H68" stroke="#000" stroke-opacity=".3" stroke-width="1.4"/>
<rect x="50" y="7.5" width="20" height="3" rx="1.5" fill="#fff" opacity=".4"/>
</g>
<rect x="55" y="22" width="10" height="10" fill="url(#case)" stroke="#000" stroke-opacity=".45" stroke-width="1"/>
<rect x="92" y="34" width="12" height="14" rx="3" transform="rotate(38 98 41)" fill="url(#case)" stroke="#000" stroke-opacity=".5" stroke-width="1.2"/>
<circle cx="60" cy="82" r="50" fill="url(#case)"/>
<circle cx="60" cy="82" r="50" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.4"/>
<circle cx="60" cy="82" r="41" style="fill:var(--obj-deep)"/>
<circle cx="60" cy="82" r="39" fill="url(#dial)"/>
<path d="M60 82 L60 43 A39 39 0 0 1 93.77 62.5 Z" style="fill:var(--obj-accent,#ff7a5c)" opacity=".28"/>
<g stroke="#1c2230" stroke-width="3" stroke-linecap="round" opacity=".75"><path d="M60 47 V54 M95 82 H88 M60 117 V110 M25 82 H32"/></g>
<g stroke="#1c2230" stroke-width="1.6" stroke-linecap="round" opacity=".5"><path d="M77.5 51.7 L74 57.8 M90.3 64.5 L84.2 68 M90.3 99.5 L84.2 96 M77.5 112.3 L74 106.2 M42.5 112.3 L46 106.2 M29.7 99.5 L35.8 96 M29.7 64.5 L35.8 68 M42.5 51.7 L46 57.8"/></g>
<g data-part="hand" data-pivot="60 82">
<path d="M60 82 L60 50" stroke="#000" stroke-opacity=".25" stroke-width="5" stroke-linecap="round" transform="translate(1.5 2)"/>
<path d="M60 88 L60 48" style="stroke:var(--obj-accent,#ff7a5c)" stroke-width="4" stroke-linecap="round"/>
</g>
<circle cx="60" cy="82" r="5.5" fill="#1c2230"/><circle cx="60" cy="82" r="2.2" fill="#fff" opacity=".7"/>
<g clip-path="url(#clip)"><g class="hl"><path d="M16 66 A46 46 0 0 1 56 36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/><ellipse cx="42" cy="54" rx="22" ry="12" fill="url(#hlg)" opacity=".4"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-40" y="20" width="26" height="130" fill="url(#sheeng)"/></g></g>
</svg>
