<!-- visitor: a student seen from the side, facing left, with a backpack. Colour: obj-base (shirt), obj-pants, obj-pack. Parts: face (flip), bob, legA, legB, armA, armB (pivots at hip and shoulder), sheen. Feet on y=244. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 250" width="120" height="250" data-object="visitor" style="overflow:visible">
<style>
svg[data-object="visitor"]{--obj-hi:color-mix(in srgb,var(--obj-base,#2ec4b6) 68%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#2ec4b6) 62%,#000);--obj-phi:color-mix(in srgb,var(--obj-pants,#1c3340) 70%,#fff);--obj-plo:color-mix(in srgb,var(--obj-pants,#1c3340) 55%,#000);--obj-kh:color-mix(in srgb,var(--obj-pack,#1f7f78) 66%,#fff);--obj-kl:color-mix(in srgb,var(--obj-pack,#1f7f78) 60%,#000)}
