<path d="M126 34 Q140 31 150 35" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
<g data-part="crank" data-pivot="112 96">
<path d="M112 96 L96 118" stroke="#10151a" stroke-width="5" stroke-linecap="round"/>
