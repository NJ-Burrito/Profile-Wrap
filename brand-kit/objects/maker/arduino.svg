<!-- arduino: Uno-style microcontroller board, top view, USB port on the left. Colour: obj-base (board). Parts: tx (data LED, blinks), pwr (power LED), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 226" width="300" height="226" data-object="arduino" style="overflow:visible">
<style>
svg[data-object="arduino"]{--obj-hi:color-mix(in srgb,var(--obj-base,#14a79b) 70%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#14a79b) 60%,#000)}
svg[data-object="arduino"] .sh{transform:translate(calc(var(--light-x,-.6)*-8px),calc(9px + var(--light-y,-.6)*-3px));opacity:calc(.3 + .2*var(--light-i,1))}
svg[data-object="arduino"] .hl{transform:translate(calc(var(--light-x,-.6)*16px),calc(var(--light-y,-.6)*8px));opacity:calc(.9*var(--light-i,1))}
</style>
<defs>
<linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".45" style="stop-color:var(--obj-base,#14a79b)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f6"/><stop offset=".5" stop-color="#bfc5ce"/><stop offset="1" stop-color="#8d95a1"/></linearGradient>
<linearGradient id="chipg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f46"/><stop offset="1" stop-color="#0d0f12"/></linearGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="14" y="14" width="272" height="198" rx="14"/></clipPath>
<filter id="blur" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect class="sh" x="16" y="26" width="270" height="196" rx="16" fill="#000" filter="url(#blur)"/>
