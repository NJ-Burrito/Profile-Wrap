<!-- jumper: female Dupont jumper wire, front view, socket opening faces up, wire hangs down. Colour: obj-base (wire insulation). Parts: plug (whole wire, swings from the bottom), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 110" width="44" height="110" data-object="jumper" style="overflow:visible">
<style>
svg[data-object="jumper"]{--obj-hi:color-mix(in srgb,var(--obj-base,#ff8f4a) 62%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#ff8f4a) 62%,#000)}
svg[data-object="jumper"] .sh{transform:translate(calc(var(--light-x,-.6)*-4px),calc(var(--light-y,-.6)*-1px));opacity:calc(.3 + .16*var(--light-i,1))}
svg[data-object="jumper"] .hl{transform:translate(calc(var(--light-x,-.6)*2px),calc(var(--light-y,-.6)*3px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#ff8f4a)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f5a"/><stop offset=".5" stop-color="#23262d"/><stop offset="1" stop-color="#0e1013"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d6a1c"/><stop offset=".5" stop-color="#f4d680"/><stop offset="1" stop-color="#8d6a1c"/></linearGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="5" y="4" width="34" height="40" rx="5"/></clipPath>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<g data-part="plug">
<path class="sh" d="M22 44 C22 74 10 84 12 106" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" filter="url(#blur)" transform="translate(3 3)"/>
<path d="M22 42 C22 72 10 82 12 106" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="9" stroke-linecap="round"/>
<path d="M22 42 C22 72 10 82 12 106" fill="none" stroke="url(#wire)" stroke-width="6.4" stroke-linecap="round"/>
<path d="M21 46 C21 72 9 82 11 104" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
<rect x="15" y="40" width="14" height="10" rx="2" fill="#15171c" stroke="#000" stroke-opacity=".5" stroke-width="1"/>
<rect x="6.5" y="6" width="34" height="40" rx="5" fill="#000" opacity=".28"/>
<rect x="5" y="4" width="34" height="40" rx="5" fill="url(#body)"/>
<rect x="5" y="4" width="34" height="11" rx="5" fill="#5b616d"/>
<rect x="5" y="9" width="34" height="6" fill="#5b616d"/>
<rect x="10" y="6.5" width="8" height="6" rx="1" fill="#06070a"/>
<rect x="26" y="6.5" width="8" height="6" rx="1" fill="#06070a"/>
<rect x="12" y="8" width="4" height="3.4" fill="url(#gold)"/>
<rect x="28" y="8" width="4" height="3.4" fill="url(#gold)"/>
<path d="M5 15 H39" stroke="#000" stroke-opacity=".5" stroke-width="1.2"/>
<path d="M11 22 V38 M22 22 V38 M33 22 V38" stroke="#000" stroke-opacity=".28" stroke-width="1.2"/>
<g clip-path="url(#clip)"><g class="hl"><ellipse cx="14" cy="18" rx="16" ry="14" fill="url(#hlg)" opacity=".4"/></g><g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-30" y="0" width="14" height="48" fill="url(#sheeng)"/></g></g>
<rect x="5" y="4" width="34" height="40" rx="5" fill="none" stroke="#000" stroke-opacity=".7" stroke-width="1.4"/>
<rect x="5.7" y="4.7" width="32.6" height="38.6" rx="4.4" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>
</g>
</svg>
