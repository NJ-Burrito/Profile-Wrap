<!-- screen: desktop monitor with a game stage (dusk sky, hills, road) and a title bar. Colours: obj-sky1, obj-sky2, obj-sun, obj-hill1, obj-hill2, obj-road. Parts: sheen. The bike, flag, lane dashes and the title text are overlaid in the composition. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 384" width="920" height="384" data-object="screen" style="overflow:visible">
<style>
svg[data-object="screen"] .sh{transform:translate(calc(var(--light-x,-.6)*-12px),calc(14px + var(--light-y,-.6)*-4px));opacity:calc(.32 + .2*var(--light-i,1))}
svg[data-object="screen"] .hl{transform:translate(calc(var(--light-x,-.6)*30px),0);opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<linearGradient id="bez" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a535c"/><stop offset=".5" stop-color="#252b31"/><stop offset="1" stop-color="#14181c"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--obj-sky1,#2b1d5c)"/><stop offset="1" style="stop-color:var(--obj-sky2,#d8508a)"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" style="stop-color:var(--obj-sun,#ffd23f)"/><stop offset="1" style="stop-color:var(--obj-sun,#ffd23f)"/></radialGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,var(--obj-road,#1c2830) 80%,#fff)"/><stop offset="1" style="stop-color:var(--obj-road,#1c2830)"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39434c"/><stop offset="1" stop-color="#232b32"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a737d"/><stop offset=".5" stop-color="#bcc3cb"/><stop offset="1" stop-color="#6a737d"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55" /><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="scr"><rect x="20" y="20" width="880" height="300" rx="10"/></clipPath>
<filter id="blur" x="-20%" y="-30%" width="140%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect class="sh" x="40" y="40" width="840" height="330" rx="26" fill="#000" filter="url(#blur)"/>
<rect x="400" y="338" width="120" height="30" fill="url(#metal)"/>
<rect x="400" y="338" width="120" height="30" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.4"/>
<rect x="320" y="362" width="280" height="20" rx="10" fill="url(#metal)" stroke="#000" stroke-opacity=".55" stroke-width="1.4"/>
<rect width="920" height="340" rx="26" fill="url(#bez)"/>
<rect width="920" height="340" rx="26" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
<circle cx="460" cy="10" r="3.2" fill="#07090b"/>
<g clip-path="url(#scr)">
<rect x="20" y="20" width="880" height="300" fill="url(#sky)"/>
<circle cx="560" cy="196" r="58" fill="url(#sun)"/>
<path d="M20 232 C120 188 210 180 300 214 C380 178 470 176 560 222 C640 190 760 184 900 220 V320 H20 Z" style="fill:var(--obj-hill2,#3a2a6a)"/>
<path d="M20 244 C150 208 250 214 340 238 C450 204 560 210 650 242 C740 214 830 220 900 240 V320 H20 Z" style="fill:var(--obj-hill1,#241a49)"/>
<rect x="20" y="248" width="880" height="72" fill="url(#road)"/>
<rect x="20" y="248" width="880" height="3" fill="#fff" opacity=".35"/>
<rect x="20" y="312" width="880" height="8" fill="#000" opacity=".25"/>
<rect x="20" y="20" width="880" height="56" fill="url(#bar)"/>
<rect x="20" y="76" width="880" height="2" fill="#000" opacity=".45"/>
<circle cx="868" cy="48" r="8" fill="#ff6b6b" opacity=".85"/><circle cx="842" cy="48" r="8" fill="#ffd23f" opacity=".85"/><circle cx="816" cy="48" r="8" fill="#6bf59a" opacity=".85"/>
<g class="hl"><path d="M20 20 H900 V132 Q460 150 20 132 Z" fill="url(#gloss)"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-18)" x="-120" y="20" width="110" height="300" fill="url(#sheeng)"/></g>
</g>
<rect x="20" y="20" width="880" height="300" rx="10" fill="none" stroke="#000" stroke-opacity=".7" stroke-width="2.5"/>
</svg>
