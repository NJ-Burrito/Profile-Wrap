[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "profile_wrap"
version = "0.2.1"
description = "A fact-gated, compliance-first LinkedIn content pipeline for Claude Code (official API only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "profile-wrap contributors" }]
keywords = ["linkedin", "claude-code", "content", "automation", "official-api", "arabic", "bilingual"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
]
dependencies = [
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
tz = ["tzdata"]
media = ["pillow", "numpy", "scipy"]
xlsx = ["openpyxl"]
sig = ["fonttools", "scikit-image"]
keys = ["keyring"]
gui = ["pywebview", "keyring"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "tzdata", "pillow", "keyring", "pyyaml", "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/NJ-Burrito/profile-wrap"
Changelog = "https://github.com/NJ-Burrito/profile-wrap/blob/main/CHANGELOG.md"
Issues = "https://github.com/NJ-Burrito/profile-wrap/issues"

[project.scripts]
profile-wrap = "profile_wrap.cli:main"
pw = "profile_wrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["profile_wrap"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "profile_wrap/_data/data"
"schema" = "profile_wrap/_data/schema"
"templates" = "profile_wrap/_data/templates"
"brand-kit" = "profile_wrap/_data/brand-kit"
"examples" = "profile_wrap/_data/examples"
"prompts" = "profile_wrap/_data/prompts"
"agents" = "profile_wrap/_data/agents"
"gui_assets" = "profile_wrap/_data/gui_assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "needs_git: test needs the git binary",
]

[tool.coverage.run]
source = ["profile_wrap"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
