<!-- servo: micro servo (SG90 type), front view, cable leaves on the right. Colour: obj-base (body), obj-horn. Parts: horn (pivot at the shaft), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 78" width="132" height="78" data-object="servo" style="overflow:visible">
<style>
svg[data-object="servo"]{--obj-hi:color-mix(in srgb,var(--obj-base,#2a6fdb) 70%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#2a6fdb) 62%,#000);--obj-deep:color-mix(in srgb,var(--obj-base,#2a6fdb) 30%,#000)}
svg[data-object="servo"] .sh{transform:translate(calc(var(--light-x,-.6)*-7px),calc(5px + var(--light-y,-.6)*-2px));opacity:calc(.3 + .18*var(--light-i,1))}
svg[data-object="servo"] .hl{transform:translate(calc(var(--light-x,-.6)*4px),calc(var(--light-y,-.6)*3px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#2a6fdb)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="horn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd4de"/></linearGradient>
<radialGradient id="boss" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aab0bd"/></radialGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="14" y="26" width="86" height="46" rx="5"/><rect x="2" y="38" width="110" height="22" rx="4"/><rect x="56" y="14" width="34" height="16" rx="5"/></clipPath>
<filter id="blur" x="-30%" y="-40%" width="160%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect class="sh" x="8" y="34" width="100" height="40" rx="6" fill="#000" filter="url(#blur)"/>
<path d="M100 56 C116 56 118 62 132 62" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="6" stroke-linecap="round" transform="translate(0 1.5)"/>
<path d="M100 50 C114 50 120 56 132 57" fill="none" stroke="#e9742c" stroke-width="3" stroke-linecap="round"/>
<path d="M100 56 C116 56 118 62 132 62" fill="none" stroke="#d62f2f" stroke-width="3" stroke-linecap="round"/>
<path d="M100 62 C112 62 120 67 132 67" fill="none" stroke="#6b3a1d" stroke-width="3" stroke-linecap="round"/>
<rect x="2" y="38" width="110" height="22" rx="4" style="fill:var(--obj-deep)"/>
<circle cx="10" cy="49" r="3.4" fill="#06101f"/>
<circle cx="104" cy="49" r="3.4" fill="#06101f"/>
<rect x="14" y="26" width="86" height="46" rx="5" fill="url(#body)"/>
<rect x="56" y="14" width="34" height="16" rx="5" fill="url(#body)"/>
<path d="M14 46 H100" stroke="#000" stroke-opacity=".18" stroke-width="1.6"/>
<rect x="24" y="40" width="26" height="18" rx="2" fill="#f4f6fa" stroke="#06101f" stroke-opacity=".5" stroke-width="1"/>
<path d="M28 46 H46 M28 52 H40" stroke="#222a3a" stroke-width="2" stroke-linecap="round"/>
<g clip-path="url(#clip)"><g class="hl"><ellipse cx="38" cy="32" rx="40" ry="14" fill="url(#hlg)" opacity=".5"/></g><g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-40" y="0" width="22" height="80" fill="url(#sheeng)"/></g></g>
<rect x="14" y="26" width="86" height="46" rx="5" fill="none" stroke="#06101f" stroke-opacity=".7" stroke-width="1.6"/>
<rect x="56" y="14" width="34" height="16" rx="5" fill="none" stroke="#06101f" stroke-opacity=".7" stroke-width="1.6"/>
<circle cx="76" cy="14" r="11" fill="url(#boss)" stroke="#06101f" stroke-opacity=".6" stroke-width="1.4"/>
<g data-part="horn" data-pivot="76 14">
<rect x="26" y="8" width="58" height="13" rx="6.5" fill="#000" opacity=".25" transform="translate(1 2.5)"/>
<rect x="26" y="8" width="58" height="13" rx="6.5" fill="url(#horn)" style="stroke:var(--obj-horn,#aeb4c2)" stroke-width="1.2"/>
<circle cx="34" cy="14.5" r="2.3" fill="#7d8494"/><circle cx="45" cy="14.5" r="2.3" fill="#7d8494"/><circle cx="56" cy="14.5" r="2.3" fill="#7d8494"/>
<circle cx="76" cy="14.5" r="6.5" fill="url(#boss)" stroke="#7d8494" stroke-width="1"/>
<circle cx="76" cy="14.5" r="2.4" fill="#4b5262"/>
<path d="M30 11 H70" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
</g>
</svg>
