<rect x="86" y="116" width="20" height="6" rx="3" fill="#10151a"/>
<rect x="120" y="70" width="20" height="6" rx="3" fill="#10151a"/>
<circle cx="112" cy="96" r="9" fill="url(#hub)" stroke="#10151a" stroke-width="1.4"/>
</g>
<circle cx="46" cy="94" r="5.5" fill="url(#hub)" stroke="#10151a" stroke-width="1.2"/>
<circle cx="174" cy="94" r="5.5" fill="url(#hub)" stroke="#10151a" stroke-width="1.2"/>
</g>
<g clip-path="url(#clip)"><g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-40" y="0" width="22" height="140" fill="url(#sheeng)"/></g></g>
</svg>
