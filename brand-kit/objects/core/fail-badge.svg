<!-- fail-badge: scalloped seal with a beveled cross (the failing twin of check-badge). Colour: obj-base (disc), obj-ring (scallop), obj-check. Parts: check, sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-object="fail-badge" style="overflow:visible">
<style>
svg[data-object="fail-badge"]{--obj-hi:color-mix(in srgb,var(--obj-base,#1b1710) 70%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#1b1710) 60%,#000);--obj-ringhi:color-mix(in srgb,var(--obj-ring,#cfff3a) 65%,#fff);--obj-ringlo:color-mix(in srgb,var(--obj-ring,#cfff3a) 64%,#000)}
svg[data-object="fail-badge"] .sh{transform:translate(calc(var(--light-x,-.6)*-6px),calc(var(--light-y,-.6)*-2px));opacity:calc(.3 + .16*var(--light-i,1))}
svg[data-object="fail-badge"] .hl{transform:translate(calc(var(--light-x,-.6)*5px),calc(var(--light-y,-.6)*5px));opacity:calc(.75*var(--light-i,1))}
</style>
<defs>
<g id="seal"><circle cx="60" cy="60" r="44"/><circle cx="60" cy="14" r="13"/><circle cx="83" cy="20.2" r="13"/><circle cx="99.8" cy="37" r="13"/><circle cx="106" cy="60" r="13"/><circle cx="99.8" cy="83" r="13"/><circle cx="83" cy="99.8" r="13"/><circle cx="60" cy="106" r="13"/><circle cx="37" cy="99.8" r="13"/><circle cx="20.2" cy="83" r="13"/><circle cx="14" cy="60" r="13"/><circle cx="20.2" cy="37" r="13"/><circle cx="37" cy="20.2" r="13"/></g>
<clipPath id="clip"><use href="#seal"/></clipPath>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-ringhi)"/><stop offset=".5" style="stop-color:var(--obj-ring,#cfff3a)"/><stop offset="1" style="stop-color:var(--obj-ringlo)"/></linearGradient>
<linearGradient id="disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#1b1710)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse class="sh" cx="62" cy="112" rx="44" ry="6" fill="#000" filter="url(#blur)"/>
<use href="#seal" fill="none" stroke="var(--obj-ringlo)" stroke-width="3" stroke-linejoin="round"/>
<use href="#seal" fill="url(#ring)"/>
<g clip-path="url(#clip)"><g class="hl"><ellipse cx="42" cy="38" rx="40" ry="26" fill="url(#hlg)" opacity=".5"/></g><g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-60" y="0" width="30" height="120" fill="url(#sheeng)"/></g></g>
<circle cx="60" cy="60" r="35" fill="var(--obj-ringlo)"/>
<circle cx="60" cy="60" r="33.5" fill="url(#disc)"/>
<circle cx="60" cy="60" r="33.5" fill="none" stroke="var(--obj-hi)" stroke-opacity=".7" stroke-width="1.4"/>
<g data-part="check" data-pivot="60 60">
<path d="M44 44 L76 76 M76 44 L44 76" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5 3)" filter="url(#soft)"/>
<path d="M44 44 L76 76 M76 44 L44 76" fill="none" stroke="var(--obj-check,#f6ffd0)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M44 42.8 L76 74.8 M76 42.8 L44 74.8" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<path d="M30 48 A33.5 33.5 0 0 1 90 46" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"/>
</svg>
