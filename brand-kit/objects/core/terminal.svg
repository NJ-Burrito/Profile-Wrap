<!-- terminal: glossy terminal window. Colour: obj-base (screen), obj-accent (prompt/check), obj-ink (code marks). Parts: caret (blink), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" data-object="terminal" style="overflow:visible">
<style>
svg[data-object="terminal"]{--obj-hi:color-mix(in srgb,var(--obj-base,#0e1530) 82%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#0e1530) 70%,#000);--obj-bar:color-mix(in srgb,var(--obj-base,#0e1530) 72%,#9aa3c0)}
svg[data-object="terminal"] .sh{transform:translate(calc(var(--light-x,-.6)*-10px),calc(var(--light-y,-.6)*-3px));opacity:calc(.32 + .2*var(--light-i,1))}
svg[data-object="terminal"] .hl{transform:translate(calc(var(--light-x,-.6)*18px),calc(var(--light-y,-.6)*10px));opacity:calc(.9*var(--light-i,1))}
</style>
<defs>
<clipPath id="clip"><rect x="6" y="6" width="308" height="196" rx="16"/></clipPath>
<linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,var(--obj-bar) 70%,#fff)"/><stop offset="1" style="stop-color:var(--obj-bar)"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-10%" y="-30%" width="120%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect class="sh" x="22" y="30" width="288" height="184" rx="20" fill="#000" filter="url(#blur)"/>
<rect x="6" y="6" width="308" height="196" rx="16" fill="url(#scr)"/>
<g clip-path="url(#clip)">
<rect x="6" y="6" width="308" height="34" fill="url(#bar)"/>
<path d="M6 40 H314" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>
<path d="M6 41 H314" stroke="#fff" stroke-opacity=".12" stroke-width="1"/>
<g stroke="#000" stroke-opacity=".35" stroke-width="1"><circle cx="26" cy="23" r="5.5" fill="#fff" fill-opacity=".7"/><circle cx="44" cy="23" r="5.5" fill="#fff" fill-opacity=".5"/><circle cx="62" cy="23" r="5.5" fill="#fff" fill-opacity=".3"/></g>
<rect x="120" y="19" width="80" height="8" rx="4" fill="#fff" fill-opacity=".3"/>
<path d="M24 62 L34 70 L24 78" fill="none" stroke="var(--obj-accent,#cfff3a)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="var(--obj-ink,#f4f4f0)"><rect x="46" y="66" width="74" height="8" rx="4" opacity=".85"/><rect x="128" y="66" width="46" height="8" rx="4" opacity=".5"/></g>
<g fill="var(--obj-ink,#f4f4f0)" opacity=".45"><rect x="24" y="92" width="150" height="8" rx="4"/><rect x="24" y="110" width="112" height="8" rx="4"/><rect x="24" y="128" width="186" height="8" rx="4"/></g>
<path d="M26 156 L33 163 L46 148" fill="none" stroke="var(--obj-accent,#cfff3a)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="152" width="88" height="8" rx="4" fill="var(--obj-accent,#cfff3a)" opacity=".8"/>
<path d="M24 182 L34 190 L24 198" fill="none" stroke="var(--obj-accent,#cfff3a)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -4)"/>
<rect data-part="caret" x="46" y="174" width="12" height="20" rx="2" fill="var(--obj-accent,#cfff3a)"/>
<path d="M6 40 L190 40 L90 202 L6 202 Z" fill="url(#gloss)"/>
<g class="hl"><path d="M6 6 H170 L110 40 H6 Z" fill="#fff" opacity=".1"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-90" y="0" width="60" height="220" fill="url(#sheeng)"/></g>
</g>
<rect x="6.75" y="6.75" width="306.5" height="194.5" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
<rect x="6" y="6" width="308" height="196" rx="16" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1"/>
</svg>
