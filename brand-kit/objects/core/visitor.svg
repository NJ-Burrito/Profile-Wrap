<linearGradient id="pantsb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--obj-pants,#1c3340)"/><stop offset="1" style="stop-color:var(--obj-plo)"/></linearGradient>
<linearGradient id="pack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-kh)"/><stop offset=".5" style="stop-color:var(--obj-pack,#1f7f78)"/><stop offset="1" style="stop-color:var(--obj-kl)"/></linearGradient>
