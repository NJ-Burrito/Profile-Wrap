name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catches upstream drift on a quiet repo

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: tests, leak scan, compliance lint (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Compliance lint
        run: python -m profile_wrap.compliance lint --root .
      - name: Leak scan (tree)
        run: python -m profile_wrap.leakcheck scan --tree .

  quickstart:
    name: README quickstart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install the way the README says
        shell: bash
        run: |
          uv tool install .
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Quickstart, step 1 and 2 (no Node, no ffmpeg, no model, no network)
        run: |
          profile-wrap init --demo --yes
          profile-wrap demo run

  leaks:
    name: leak scan with the private denylist
    runs-on: ubuntu-latest
    env:
      # A repository secret holding the salted-hash JSON (hashes only, never the terms).
      LEAK_DENYLIST_JSON: ${{ secrets.PROFILE_WRAP_LEAK_DENYLIST_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Require the private denylist (fail, never skip, on push and schedule)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$LEAK_DENYLIST_JSON" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::warning::private denylist not available to this pull request (fork or Dependabot); the private-term scan did not run"
            else
              echo "::error::PROFILE_WRAP_LEAK_DENYLIST_JSON is missing: the private-term scan cannot run. Add the repository secret (hashes only)."
              exit 1
            fi
          fi
      - name: Write denylist outside the checkout
        if: env.LEAK_DENYLIST_JSON != ''
        run: |
          printf '%s' "$LEAK_DENYLIST_JSON" > "$RUNNER_TEMP/denylist.json"
          echo "PROFILE_WRAP_LEAK_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"
      - name: Leak scan (tree)
        run: python -m profile_wrap.leakcheck scan --tree .
      # --dist runs in the release workflow once wheel, sdist and zipapp are built (milestone M5).
