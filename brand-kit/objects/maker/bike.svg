<g stroke="#c9d0d8" stroke-width="1.6" stroke-linecap="round"><path d="M174 62 V126 M142 94 H206 M151.4 71.4 L196.6 116.6 M196.6 71.4 L151.4 116.6"/></g>
<circle cx="174" cy="61" r="3.2" style="fill:var(--obj-base,#ff4f93)"/>
</g>
<g data-part="body" data-pivot="110 100">
<path class="fo" d="M46 94 L68 48 L134 50 L112 96 L174 94 L134 50 M68 48 L112 96 M134 50 L136 38"/>
<path class="fo" d="M68 48 L62 36 L46 34"/>
<path class="fr" d="M46 94 L68 48 L134 50 L112 96 L174 94 L134 50 M68 48 L112 96 M134 50 L136 38"/>
<path class="fh" d="M70 46 L131 47.6"/>
<path class="fr" d="M68 48 L62 36 L46 34"/>
