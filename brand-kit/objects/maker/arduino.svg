<g clip-path="url(#clip)"><g class="hl"><ellipse cx="110" cy="40" rx="120" ry="30" fill="url(#hlg)" opacity=".35"/></g><g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-40" y="0" width="30" height="226" fill="url(#sheeng)"/></g></g>
</svg>
