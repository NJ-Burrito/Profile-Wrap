<!-- flag: finish flag on a pole. Colour: obj-pole. Parts: wave (the cloth, waves about the pole), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160" width="90" height="160" data-object="flag" style="overflow:visible">
<style>
svg[data-object="flag"] .sh{transform:translate(calc(var(--light-x,-.6)*-6px),0);opacity:calc(.3 + .2*var(--light-i,1))}
</style>
<defs>
<linearGradient id="pole" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b838d"/><stop offset=".45" stop-color="#e8ecf0"/><stop offset="1" stop-color="#7b838d"/></linearGradient>
<linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><path d="M10 8 H84 V68 H10 Z"/></clipPath>
<filter id="blur" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<ellipse class="sh" cx="10" cy="158" rx="24" ry="4" fill="#000" filter="url(#blur)"/>
<rect x="5" y="2" width="9" height="156" rx="4.5" fill="url(#pole)" stroke="#000" stroke-opacity=".5" stroke-width="1.2"/>
<circle cx="9.5" cy="4" r="6" fill="url(#pole)" stroke="#000" stroke-opacity=".5" stroke-width="1.2"/>
<g data-part="wave" data-pivot="14 38">
<g clip-path="url(#cl)">
<rect x="10" y="8" width="74" height="60" fill="#f4f5f7"/>
<g fill="#10151a"><rect x="10" y="8" width="18.5" height="15"/><rect x="47" y="8" width="18.5" height="15"/><rect x="28.5" y="23" width="18.5" height="15"/><rect x="65.5" y="23" width="18.5" height="15"/><rect x="10" y="38" width="18.5" height="15"/><rect x="47" y="38" width="18.5" height="15"/><rect x="28.5" y="53" width="18.5" height="15"/><rect x="65.5" y="53" width="18.5" height="15"/></g>
<rect x="10" y="8" width="74" height="60" fill="url(#cloth)"/>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-10" y="0" width="14" height="80" fill="url(#sheeng)"/></g>
</g>
<rect x="10" y="8" width="74" height="60" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.4"/>
</g>
</svg>
