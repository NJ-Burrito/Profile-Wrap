<!-- basketball: pebbled leather ball with black channel seams. Colour: obj-base (leather). Parts: turn (roll), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" data-object="basketball" style="overflow:visible">
<style>
svg[data-object="basketball"]{--obj-hi:color-mix(in srgb,var(--obj-base,#ff8a3d) 66%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#ff8a3d) 64%,#000);--obj-deep:color-mix(in srgb,var(--obj-base,#ff8a3d) 18%,#000)}
svg[data-object="basketball"] .sh{transform:translate(calc(var(--light-x,-.6)*-9px),calc(var(--light-y,-.6)*-2px));opacity:calc(.3 + .16*var(--light-i,1))}
svg[data-object="basketball"] .hl{transform:translate(calc(var(--light-x,-.6)*9px),calc(var(--light-y,-.6)*9px));opacity:calc(.7*var(--light-i,1))}
</style>
<defs>
<clipPath id="clip"><circle cx="100" cy="92" r="80"/></clipPath>
<radialGradient id="ball" cx=".38" cy=".32" r=".8"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#ff8a3d)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></radialGradient>
<radialGradient id="shade" cx=".4" cy=".34" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="peb" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1" fill="#000" fill-opacity=".16"/><circle cx="5.3" cy="5.3" r="1" fill="#000" fill-opacity=".16"/><circle cx="1.2" cy="1.2" r=".6" fill="#fff" fill-opacity=".14"/></pattern>
<filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
</defs>
<ellipse class="sh" cx="104" cy="182" rx="62" ry="7" fill="#000" filter="url(#blur)"/>
<circle cx="100" cy="92" r="80" fill="url(#ball)"/>
<g clip-path="url(#clip)">
<rect x="10" y="4" width="180" height="180" fill="url(#peb)"/>
<g data-part="turn" data-pivot="100 92" fill="none" stroke-linecap="round">
<path d="M100 8 V176 M16 92 H184" stroke="var(--obj-deep)" stroke-width="5.4"/>
<path d="M44 22 C84 60 84 124 44 162 M156 22 C116 60 116 124 156 162" stroke="var(--obj-deep)" stroke-width="5.4"/>
<path d="M97.5 8 V176 M16 89.5 H184" stroke="#fff" stroke-opacity=".16" stroke-width="1.4"/>
</g>
<circle cx="100" cy="92" r="80" fill="url(#shade)"/>
<g class="hl"><ellipse cx="68" cy="52" rx="34" ry="20" fill="url(#hlg)" opacity=".7" transform="rotate(-28 68 52)"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-40" y="0" width="30" height="190" fill="url(#sheeng)"/></g>
</g>
<circle cx="100" cy="92" r="80" fill="none" stroke="var(--obj-deep)" stroke-opacity=".7" stroke-width="2"/>
</svg>
