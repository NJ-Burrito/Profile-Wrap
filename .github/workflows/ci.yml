name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catches upstream drift on a quiet repo

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: tests, leak scan, compliance lint (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Compliance lint
        run: python -m profile_wrap.compliance lint --root .
      - name: Leak scan (tree)
        run: python -m profile_wrap.leakcheck scan --tree .

  quickstart:
    name: README quickstart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the way the README says
        run: python -m pip install .
      - name: Quickstart, step 1 and 2 (no Node, no ffmpeg, no model, no network)
        run: |
          profile-wrap init --demo --yes
          profile-wrap demo run

  leaks:
    name: leak scan with the private denylist
    runs-on: ubuntu-latest
    env:
      # A repository secret holding the salted-hash JSON (hashes only, never the terms).
      LEAK_DENYLIST_JSON: ${{ secrets.PROFILE_WRAP_LEAK_DENYLIST_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Write denylist outside the checkout
        if: env.LEAK_DENYLIST_JSON != ''
        run: |
          printf '%s' "$LEAK_DENYLIST_JSON" > "$RUNNER_TEMP/denylist.json"
          echo "PROFILE_WRAP_LEAK_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"
      - name: Leak scan (tree)
        run: python -m profile_wrap.leakcheck scan --tree .
      # --dist runs in the release workflow once wheel, sdist and zipapp are built (milestone M5).
