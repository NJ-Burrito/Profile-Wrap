<!-- retry: round arcade push-button with the refresh arrows on its cap. Colour: obj-face (cap), obj-ink (arrows). Parts: face (sinks on press), arrows (turn), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130" data-object="retry" style="overflow:visible">
<style>
svg[data-object="retry"]{--obj-hi:color-mix(in srgb,var(--obj-face,#c9d8a6) 62%,#fff);--obj-lo:color-mix(in srgb,var(--obj-face,#c9d8a6) 60%,#000);--obj-lip:color-mix(in srgb,var(--obj-face,#c9d8a6) 45%,#000)}
svg[data-object="retry"] .sh{transform:translate(calc(var(--light-x,-.6)*-6px),calc(var(--light-y,-.6)*-2px));opacity:calc(.32 + .18*var(--light-i,1))}
svg[data-object="retry"] .hl{transform:translate(calc(var(--light-x,-.6)*5px),calc(var(--light-y,-.6)*4px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5d52"/><stop offset=".5" stop-color="#2c2e26"/><stop offset="1" stop-color="#0f100b"/></linearGradient>
<linearGradient id="lip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--obj-lip)"/><stop offset=".5" style="stop-color:color-mix(in srgb,var(--obj-lip) 70%,#fff)"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--obj-lip) 55%,#000)"/></linearGradient>
<radialGradient id="cap" cx=".38" cy=".3" r=".85"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".55" style="stop-color:var(--obj-face,#c9d8a6)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></radialGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><circle cx="60" cy="52" r="40"/></clipPath>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse class="sh" cx="62" cy="116" rx="50" ry="8" fill="#000" filter="url(#blur)"/>
<ellipse cx="60" cy="100" rx="54" ry="14" fill="url(#plate)"/>
<ellipse cx="60" cy="97" rx="54" ry="14" fill="#2a2c24" stroke="#fff" stroke-opacity=".18" stroke-width="1.4"/>
<path d="M20 64 V84 A40 12 0 0 0 100 84 V64 Z" fill="url(#lip)"/>
<path d="M20 64 V84 A40 12 0 0 0 100 84 V64" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="1.4"/>
<g data-part="face">
<circle cx="60" cy="56" r="40" fill="#000" opacity=".3" transform="translate(0 4)"/>
<circle cx="60" cy="52" r="40" fill="url(#cap)"/>
<g clip-path="url(#clip)"><g class="hl"><ellipse cx="46" cy="34" rx="28" ry="16" fill="url(#hlg)"/></g><g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-30" y="8" width="24" height="90" fill="url(#sheeng)"/></g></g>
<circle cx="60" cy="52" r="40" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6"/>
<circle cx="60" cy="52" r="40" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="1"/>
<circle cx="60" cy="52" r="29" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2"/>
<g data-part="arrows" data-pivot="60 52">
<g transform="translate(60 52) scale(1.55) translate(-12 -12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g stroke="#fff" stroke-opacity=".45" stroke-width="2.4" transform="translate(.4 .6)"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<g style="stroke:var(--obj-ink,#12130a)" stroke-width="2.4"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
</g>
</g>
</g>
</svg>
