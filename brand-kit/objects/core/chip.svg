<!-- chip: microchip (intelligent systems), top view with legs on four sides. Colour: obj-base (package), obj-accent (die glow). Parts: core (glow), sheen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-object="chip" style="overflow:visible">
<style>
svg[data-object="chip"]{--obj-hi:color-mix(in srgb,var(--obj-base,#2b2f3a) 70%,#fff);--obj-lo:color-mix(in srgb,var(--obj-base,#2b2f3a) 60%,#000)}
svg[data-object="chip"] .sh{transform:translate(calc(var(--light-x,-.6)*-6px),calc(5px + var(--light-y,-.6)*-2px));opacity:calc(.3 + .18*var(--light-i,1))}
svg[data-object="chip"] .hl{transform:translate(calc(var(--light-x,-.6)*5px),calc(var(--light-y,-.6)*5px));opacity:calc(.8*var(--light-i,1))}
</style>
<defs>
<linearGradient id="pkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--obj-hi)"/><stop offset=".5" style="stop-color:var(--obj-base,#2b2f3a)"/><stop offset="1" style="stop-color:var(--obj-lo)"/></linearGradient>
<linearGradient id="leg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fa"/><stop offset="1" stop-color="#8a909e"/></linearGradient>
<radialGradient id="hlg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="coreg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".35" style="stop-color:var(--obj-accent,#4fe3e1)"/><stop offset="1" style="stop-color:var(--obj-accent,#4fe3e1)" stop-opacity="0"/></radialGradient>
<linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="26" y="26" width="68" height="68" rx="8"/></clipPath>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.4"/></filter>
</defs>
<rect class="sh" x="22" y="30" width="80" height="80" rx="10" fill="#000" filter="url(#blur)"/>
<g fill="url(#leg)" stroke="#000" stroke-opacity=".45" stroke-width=".8">
<rect x="34" y="12" width="7" height="16" rx="1.5"/><rect x="47" y="12" width="7" height="16" rx="1.5"/><rect x="60" y="12" width="7" height="16" rx="1.5"/><rect x="73" y="12" width="7" height="16" rx="1.5"/>
<rect x="34" y="92" width="7" height="16" rx="1.5"/><rect x="47" y="92" width="7" height="16" rx="1.5"/><rect x="60" y="92" width="7" height="16" rx="1.5"/><rect x="73" y="92" width="7" height="16" rx="1.5"/>
<rect x="12" y="34" width="16" height="7" rx="1.5"/><rect x="12" y="47" width="16" height="7" rx="1.5"/><rect x="12" y="60" width="16" height="7" rx="1.5"/><rect x="12" y="73" width="16" height="7" rx="1.5"/>
<rect x="92" y="34" width="16" height="7" rx="1.5"/><rect x="92" y="47" width="16" height="7" rx="1.5"/><rect x="92" y="60" width="16" height="7" rx="1.5"/><rect x="92" y="73" width="16" height="7" rx="1.5"/>
</g>
<rect x="26" y="28" width="68" height="68" rx="8" fill="#000" fill-opacity=".5"/>
<rect x="26" y="26" width="68" height="68" rx="8" fill="url(#pkg)"/>
<g clip-path="url(#clip)">
<path d="M26 60 H44 L50 54 M94 60 H76 L70 66 M60 26 V44 L66 50 M60 94 V76 L54 70" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.6" stroke-linecap="round"/>
<g class="hl"><ellipse cx="46" cy="38" rx="40" ry="20" fill="url(#hlg)" opacity=".5"/></g>
<g data-part="sheen" opacity="0"><rect transform="skewX(-16)" x="-46" y="20" width="26" height="80" fill="url(#sheeng)"/></g>
</g>
<rect x="26" y="26" width="68" height="68" rx="8" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.4"/>
<rect x="26" y="26" width="68" height="68" rx="8" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="1"/>
<circle cx="35" cy="35" r="2.6" fill="#000" fill-opacity=".5" stroke="#fff" stroke-opacity=".35" stroke-width=".8"/>
<rect x="44" y="44" width="32" height="32" rx="5" fill="#05070b" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
<g data-part="core" data-pivot="60 60"><circle cx="60" cy="60" r="22" fill="url(#coreg)" opacity=".85"/><rect x="51" y="51" width="18" height="18" rx="3.4" style="fill:var(--obj-accent,#4fe3e1)"/><rect x="53.6" y="53.6" width="7" height="5" rx="1.6" fill="#fff" fill-opacity=".75"/></g>
</svg>
